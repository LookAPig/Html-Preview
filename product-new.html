    <section class="lzm" data-scrub="pin" aria-label="Go far away">

    <section class="lof" id="offer" aria-label="Launch offer">

      <ul class="lof__perks reveal" data-delay="1" id="lofPerks"></ul>

    <section class="faq" id="faq" aria-label="Frequently asked questions">

        <p class="eyebrow eyebrow--dot">FAQ</p>
        <h2>Questions? <em>Answered.</em></h2>
